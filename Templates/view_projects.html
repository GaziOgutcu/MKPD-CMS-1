<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MKPD CMS / View Project Details</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">

</head>
<body class="bg-light">

    <!-- ✅ Navbar Placeholder (Loads navbar dynamically) -->
    <div id="navbar-placeholder"></div>


    <!-- Main Logo Section -->
    <div class="text-center my-4">
        <a href="/">
            <img src="{{ url_for('static', filename='logo1.jpg') }}" alt="Company Logo" class="img-fluid mb-4 main-logo">
        </a>
    </div>

    <!-- Page Header -->
    <div class="container mt-5">
        <h1 class="text-center text-primary">Projects</h1>

        <!-- Responsive Grid for Projects -->
        <div class="row row-cols-1 row-cols-md-3 g-4 mt-4">
            {% for project in projects %}
            <div class="col">
                <div class="card project-card shadow-sm">
                    <img src="{{ url_for('static', filename='project_images/' ~ project['Image Filename']) }}" alt="Project Image" class="card-img-top">
                    <div class="card-body text-center">
                        <h5 class="card-title">{{ project['Project Name'] }}</h5>
                        <a href="{{ url_for('view_project', project_name=project['Project Name']) }}" class="btn btn-primary btn-sm">View Project</a>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>

        <!-- Back to Main Menu Button -->
        <div class="d-grid gap-2 d-md-flex justify-content-md-center mt-4">
            <a href="/" class="btn btn-secondary">Back to Main Menu</a>
        </div>
    </div>

    <!-- Footer -->
    <div class="text-center mt-5">
        <p class="small text-muted">&copy; 2024 Gazi OGUTCU. All rights reserved.</p>
    </div>

    <!-- ✅ JavaScript to Load Navbar -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            fetch("/navbar")  // ✅ Fetch from Flask route
                .then(response => {
                    if (!response.ok) {
                        throw new Error("Navbar file not found!");
                    }
                    return response.text();
                })
                .then(data => {
                    document.getElementById("navbar-placeholder").innerHTML = data;
                })
                .catch(error => console.error("Error loading navbar:", error));
        });
    </script>

</body>
</html>
