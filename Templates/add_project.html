<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harm Drive Pty Ltd</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom CSS -->
    <style>
        /* Navbar Styling */
        .navbar {
            background-color: #003366; /* Navy blue background */
            padding: 10px 20px;
        }

        .navbar a {
            color: white; /* Set link color */
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
        }

        .navbar a:hover, .dropdown-item:hover {
            color: yellow; /* Highlight links on hover */
        }

        .dropdown-menu {
            background-color: #003366; /* Match dropdown with navbar */
        }

        .dropdown-item {
            color: white; /* Dropdown link color */
        }

        .dropdown-item:hover {
            background-color: #00509e; /* Highlight dropdown item */
        }

        /* Logo Styling */
        .logo {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: white;
            font-family: 'Futura', sans-serif; /* Modern font */
        }

        .logo-mkpd {
            font-size: 1.2rem;
            font-weight: bold;
            line-height: 1;
        }

        .logo-cms {
            font-size: 1rem;
            line-height: 1;
        }

        /* Main Logo Styling */
        .main-logo {
            max-width: 300px; /* Increased size for the logo */
        }

        .welcome-text {
            text-align: center;
            margin-top: 50px;
        }

        .welcome-text h1 {
            font-size: 3rem;
            color: #003366;
            font-weight: bold;
        }

        .welcome-text p {
            font-size: 1.2rem;
            color: #666;
        }

        .welcome-text .btn-primary {
            margin-top: 20px;
            padding: 10px 30px;
            font-size: 1.1rem;
        }



        .add-vehicle-form {
            margin-top: 20px;
        }

        .add-vehicle-section {
            margin-bottom: 50px; /* Adds space after Add Vehicle section */
        }

        .copyright {
            position: fixed;
            bottom: 0;
            right: 0;
            padding: 10px;
            font-size: 12px;
            color: #6c757d;
            background-color: #f8f9fa;
            border-top-left-radius: 5px;
        }
    </style>
</head>
<body class="bg-light">


        <!-- Navigation Menu -->
        <nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
        <!-- Logo -->
        <a class="navbar-brand logo" href="{{ url_for('index') }}">
            <span class="logo-mkpd">MKPD</span>
            <span class="logo-cms">CMS</span>
        </a>

        <!-- ✅ Navbar Toggler Button (MISSING in your code) -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Navbar Links -->
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" id="companiesDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        Companies
                    </a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="/view_company">View Companies</a></li>
                        <li><a class="dropdown-item" href="/add_company">Add Company</a></li>
                    </ul>
                </li>
                <li class="nav-item"><a class="nav-link" href="/harm_drive">Harm Drive</a></li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" id="employeesDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        Employees
                    </a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="/add_employee">Add Employee</a></li>
                        <li><a class="dropdown-item" href="/search_employee">Search Employee</a></li>
                    </ul>
                </li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" id="projectsDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        Projects
                    </a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="/add_project">Add a Project</a></li>
                        <li><a class="dropdown-item" href="/view_projects">View Projects</a></li>
                    </ul>
                </li>
            </ul>
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/logout">Logout</a></li>
            </ul>
        </div>
    </div>
</nav>



    <!-- Main Logo Section -->
    <div class="text-center my-4">
        <a href="/">
            <img src="{{ url_for('static', filename='logo1.jpg') }}" alt="Company Logo" class="img-fluid mb-4 main-logo">
        </a>
    </div>

    <!-- Page Content -->
    <div class="container mt-5">
        <h1 class="text-center">Add a New Project</h1>
        <form method="POST" action="/add_project" enctype="multipart/form-data" class="mt-4">
            <div class="mb-3">
                <label for="projectName" class="form-label">Project Name</label>
                <input type="text" class="form-control" id="projectName" name="project_name" placeholder="Enter project name" required>
            </div>
            <div class="mb-3">
                <label for="projectDescription" class="form-label">Project Description</label>
                <textarea class="form-control" id="projectDescription" name="project_description" rows="4" placeholder="Enter project description" required></textarea>
            </div>
            <div class="mb-3">
                <label for="startDate" class="form-label">Start Date</label>
                <input type="date" class="form-control" id="startDate" name="start_date" required>
            </div>
            <div class="mb-3">
                <label for="endDate" class="form-label">End Date</label>
                <input type="date" class="form-control" id="endDate" name="end_date" required>
            </div>
            <div class="mb-3">
                <label for="projectImage" class="form-label">Project Image</label>
                <input type="file" class="form-control" id="projectImage" name="project_image" accept="image/*">
            </div>
            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                <button type="submit" class="btn btn-success">Add Project</button>
                <a href="/" class="btn btn-secondary">Back to Main Menu</a>
            </div>
        </form>
    </div>

    <!-- Footer -->
    <div class="footer">
        &copy; 2024 MKPD CMS. All rights reserved.
    </div>

</body>
</html>
