{% extends 'base.html' %}
{% block title %}Add Project · MKPD CMS{% endblock %}
{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h1 class="h4 mb-0">Add Project</h1>
                </div>
                <div class="card-body">
                    <form method="POST" enctype="multipart/form-data" class="row g-3">
                        <div class="col-12">
                            <label for="project_name" class="form-label">Project Name</label>
                            <input type="text" id="project_name" name="project_name" class="form-control" required>
                        </div>
                        <div class="col-12">
                            <label for="project_description" class="form-label">Description</label>
                            <textarea id="project_description" name="project_description" class="form-control" rows="4" required></textarea>
                        </div>
                        <div class="col-md-6">
                            <label for="start_date" class="form-label">Start Date</label>
                            <input type="date" id="start_date" name="start_date" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label for="end_date" class="form-label">End Date</label>
                            <input type="date" id="end_date" name="end_date" class="form-control" required>
                        </div>
                        <div class="col-12">
                            <label for="project_image" class="form-label">Project Image (optional)</label>
                            <input type="file" id="project_image" name="project_image" class="form-control" accept=".jpg,.jpeg,.png">
                        </div>
                        <div class="col-12 d-flex justify-content-between">
                            <a href="{{ url_for('view_projects') }}" class="btn btn-outline-secondary">Cancel</a>
                            <button type="submit" class="btn btn-success">Save Project</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
