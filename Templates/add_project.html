<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Meta Tags -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MKPD CMS / Add a New Project</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body class="bg-light">
    <!-- ✅ Navbar Placeholder -->
    <div id="navbar-placeholder"></div>

    <!-- ✅ Logo Section -->
    <div class="container text-center my-4">
        <a href="/">
            <img src="{{ url_for('static', filename='logo1.jpg') }}" alt="Company Logo" class="img-fluid main-logo">
        </a>
    </div>

    <!-- ✅ Add Project Form Section -->
    <div class="container py-5">
        <!-- Page Title -->
        <h1 class="text-center mb-4">Add a New Project</h1>

        <!-- Project Form -->
        <form method="POST" action="/add_project" enctype="multipart/form-data" class="form-container mx-auto" style="max-width: 600px;">
            <!-- Project Name -->
            <div class="mb-3">
                <label for="projectName" class="form-label">Project Name:</label>
                <input type="text" class="form-control" id="projectName" name="project_name" placeholder="Enter project name" required>
            </div>

            <!-- Project Description -->
            <div class="mb-3">
                <label for="projectDescription" class="form-label">Project Description:</label>
                <textarea class="form-control" id="projectDescription" name="project_description" rows="4" placeholder="Enter project description" required></textarea>
            </div>

            <!-- Start Date -->
            <div class="mb-3">
                <label for="startDate" class="form-label">Start Date:</label>
                <input type="date" class="form-control" id="startDate" name="start_date" required>
            </div>

            <!-- End Date -->
            <div class="mb-3">
                <label for="endDate" class="form-label">End Date:</label>
                <input type="date" class="form-control" id="endDate" name="end_date" required>
            </div>

            <!-- Project Image -->
            <div class="mb-4">
                <label for="projectImage" class="form-label">Project Image:</label>
                <input type="file" class="form-control" id="projectImage" name="project_image" accept="image/*">
            </div>

            <!-- Action Buttons -->
            <div class="d-flex justify-content-between">
                <a href="/" class="btn btn-secondary">Back to Main Menu</a>
                <button type="submit" class="btn btn-success">Add Project</button>
            </div>
        </form>
    </div>

    <!-- ✅ Footer Section -->
    <footer class="text-center mt-5">
        <p class="small text-muted">&copy; 2024 Gazi OGUTCU. All rights reserved.</p>
    </footer>

    <!-- ✅ JavaScript to Load Navbar -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            fetch("/navbar")
                .then(response => {
                    if (!response.ok) {
                        throw new Error("Navbar file not found!");
                    }
                    return response.text();
                })
                .then(data => {
                    document.getElementById("navbar-placeholder").innerHTML = data;
                })
                .catch(error => console.error("Error loading navbar:", error));
        });
    </script>

    <!-- ✅ Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
