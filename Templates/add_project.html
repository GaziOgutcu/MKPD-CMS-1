<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MKPD CMS / Add a new project </title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">

</head>
<body class="bg-light">


       <!-- ✅ Navbar Placeholder (Loads navbar dynamically) -->
    <div id="navbar-placeholder"></div>



    <!-- Main Logo Section -->
    <div class="text-center my-4">
        <a href="/">
            <img src="{{ url_for('static', filename='logo1.jpg') }}" alt="Company Logo" class="img-fluid mb-4 main-logo">
        </a>
    </div>

    <!-- Page Content -->
    <div class="container mt-5">
        <h1 class="text-center">Add a New Project</h1>
        <form method="POST" action="/add_project" enctype="multipart/form-data" class="mt-4">
            <div class="mb-3">
                <label for="projectName" class="form-label">Project Name</label>
                <input type="text" class="form-control" id="projectName" name="project_name" placeholder="Enter project name" required>
            </div>
            <div class="mb-3">
                <label for="projectDescription" class="form-label">Project Description</label>
                <textarea class="form-control" id="projectDescription" name="project_description" rows="4" placeholder="Enter project description" required></textarea>
            </div>
            <div class="mb-3">
                <label for="startDate" class="form-label">Start Date</label>
                <input type="date" class="form-control" id="startDate" name="start_date" required>
            </div>
            <div class="mb-3">
                <label for="endDate" class="form-label">End Date</label>
                <input type="date" class="form-control" id="endDate" name="end_date" required>
            </div>
            <div class="mb-3">
                <label for="projectImage" class="form-label">Project Image</label>
                <input type="file" class="form-control" id="projectImage" name="project_image" accept="image/*">
            </div>
            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                <button type="submit" class="btn btn-success">Add Project</button>
                <a href="/" class="btn btn-secondary">Back to Main Menu</a>
            </div>
        </form>
    </div>

    <!-- Footer -->
    <div class="text-center mt-5">
        <p class="small text-muted">&copy; 2024 Gazi OGUTCU. All rights reserved.</p>
    </div>

    <!-- ✅ JavaScript to Load Navbar -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            fetch("/navbar")  // ✅ Fetch from Flask route
                .then(response => {
                    if (!response.ok) {
                        throw new Error("Navbar file not found!");
                    }
                    return response.text();
                })
                .then(data => {
                    document.getElementById("navbar-placeholder").innerHTML = data;
                })
                .catch(error => console.error("Error loading navbar:", error));
        });
    </script>

</body>
</html>
