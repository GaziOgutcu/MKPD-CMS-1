<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Wahoo Pool Vehicle</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>

    <div class="container mt-5">
        <div class="card dashboard-card wahoo-vehicles-card shadow">
            <div class="card-header bg-success text-white text-center">
                <h3 class="mb-0">Add Wahoo Pool Vehicle</h3>
            </div>

            <div class="card-body">
                <form method="POST" action="{{ url_for('add_wahoo_vehicle') }}">
                    <div class="mb-3">
                        <label class="form-label">Plate Number</label>
                        <input type="text" name="plate" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Vehicle Type</label>
                        <input type="text" name="type" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Days Until Expiry</label>
                        <input type="number" name="expiry" class="form-control" required>
                    </div>

                    <div class="text-center">
                        <button type="submit" class="cta">
                            <span>Add Vehicle</span>
                            <svg width="15px" height="10px" viewBox="0 0 13 10">
                                <path d="M1,5 L11,5"></path>
                                <polyline points="8 1 12 5 8 9"></polyline>
                            </svg>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
