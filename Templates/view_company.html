{% extends 'base.html' %}
{% block title %}View Companies · MKPD CMS{% endblock %}
{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-10 col-xl-8">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h1 class="h4 mb-0">Company Directory</h1>
                </div>
                <div class="card-body">
                    <form method="POST" class="row g-3 align-items-end">
                        <div class="col-md-8">
                            <label for="company_id" class="form-label">Select a company</label>
                            <select id="company_id" name="company_id" class="form-select" required>
                                <option value="" selected disabled>Choose...</option>
                                {% for company in companies %}
                                    <option value="{{ company.id }}">{{ company.company_name }} (ABN {{ company.abn }})</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-4">
                            <button type="submit" class="btn btn-primary w-100">View Details</button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="card shadow-sm mt-4">
                <div class="card-body">
                    <h2 class="h5">Need to add a new company?</h2>
                    <p class="text-muted mb-3">Keep registration records current by uploading ASIC extracts and supporting documents.</p>
                    <a href="{{ url_for('add_company') }}" class="btn btn-success">Add Company</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
