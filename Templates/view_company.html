<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MKPD CMS / View Company Details</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">

</head>
<body class="bg-light">

    <!-- ✅ Navbar Placeholder (Loads navbar dynamically) -->
    <div id="navbar-placeholder"></div>


    <!-- Logo Section -->
    <div class="text-center my-4">
        <a href="/">
            <img src="{{ url_for('static', filename='logo1.jpg') }}" alt="Company Logo" class="img-fluid mb-4 main-logo">
        </a>
    </div>



    <!-- View Companies Section -->
    <div class="container py-5">
        <h1 class="text-center mb-4">View Company Details</h1>
        <form method="POST" class="form-container">
            <div class="mb-3">
                <label for="company_name" class="form-label">Select a Company:</label>
                <select name="company_name" id="company_name" class="form-select" required>
                    <option value="" disabled selected>Select a company</option>
                    {% for company in companies %}
                        <option value="{{ company['Company Name'] }}">{{ company['Company Name'] }}</option>
                    {% endfor %}
                </select>
                <div class="form-text">Choose a company to view its details.</div>
            </div>
            <div class="d-flex justify-content-between">
                <a href="/" class="btn btn-secondary">Back to Main Menu</a>
                <button type="submit" class="btn btn-info">View Details</button>
            </div>
        </form>
    </div>

    <!-- Footer -->
    <div class="copyright">
        &copy; 2024 Gazi OGUTCU. All rights reserved.
    </div>

    <!-- ✅ JavaScript to Load Navbar -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            fetch("/navbar")  // ✅ Fetch from Flask route
                .then(response => {
                    if (!response.ok) {
                        throw new Error("Navbar file not found!");
                    }
                    return response.text();
                })
                .then(data => {
                    document.getElementById("navbar-placeholder").innerHTML = data;
                })
                .catch(error => console.error("Error loading navbar:", error));
        });
    </script>

</body>
</html>
