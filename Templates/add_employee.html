<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MKPD CMS / Add a new employee </title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">

</head>
<body class="bg-light">

    <!-- Navbar -->
    <!-- ✅ Navbar Placeholder (Loads navbar dynamically) -->
    <div id="navbar-placeholder"></div>

    <!-- Logo Section -->
    <div class="text-center my-4">
        <a href="/">
            <img src="{{ url_for('static', filename='logo1.jpg') }}" alt="Company Logo" class="img-fluid mb-4 main-logo">
        </a>
    </div>

    <!-- Add Employee Section -->
    <div class="container mt-5">
        <h1 class="text-center mb-4">Add New Employee</h1>
        <form method="POST">
            <!-- Name Fields -->
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="name" class="form-label">First Name</label>
                    <input type="text" class="form-control" id="name" name="name" required>
                </div>
                <div class="col-md-6">
                    <label for="family_name" class="form-label">Family Name</label>
                    <input type="text" class="form-control" id="family_name" name="family_name" required>
                </div>
            </div>

            <!-- TFN and ABN Fields -->
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="tfn" class="form-label">TFN</label>
                    <input type="text" class="form-control" id="tfn" name="tfn" required>
                </div>
                <div class="col-md-6">
                    <label for="abn" class="form-label">ABN</label>
                    <input type="text" class="form-control" id="abn" name="abn" required>
                </div>
            </div>

            <!-- Address Field -->
            <div class="mb-3">
                <label for="address" class="form-label">Address</label>
                <input type="text" class="form-control" id="address" name="address" required>
            </div>

            <!-- Email and Phone Fields -->
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" class="form-control" id="email" name="email" required>
                </div>
                <div class="col-md-6">
                    <label for="phone" class="form-label">Phone Number</label>
                    <input type="text" class="form-control" id="phone" name="phone" required>
                </div>
            </div>

            <!-- Add Employee Button -->
            <div class="d-flex justify-content-center mb-5">
                <button type="submit" class="btn btn-success mx-2">Add Employee</button>
            </div>
        </form>

        <!-- Centered Navigation Buttons -->
        <div class="d-flex justify-content-center">
            <a href="/" class="btn btn-danger mx-2">Back to Main Menu</a>
        </div>
    </div>

    <!-- Footer -->
    <div class="copyright">
        &copy; 2024 Gazi OGUTCU. All rights reserved.
    </div>

    <!-- ✅ JavaScript to Load Navbar -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            fetch("/navbar")  // ✅ Fetch from Flask route
                .then(response => {
                    if (!response.ok) {
                        throw new Error("Navbar file not found!");
                    }
                    return response.text();
                })
                .then(data => {
                    document.getElementById("navbar-placeholder").innerHTML = data;
                })
                .catch(error => console.error("Error loading navbar:", error));
        });
    </script>

</body>
</html>
