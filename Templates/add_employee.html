<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Basic Meta Tags -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MKPD CMS / Add a New Employee</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body class="bg-light">
    <!-- ✅ Navbar Placeholder -->
    <!-- This will dynamically load the navbar -->
    <div id="navbar-placeholder"></div>

    <!-- ✅ Logo Section -->
    <div class="container text-center my-4">
        <a href="/">
            <img src="{{ url_for('static', filename='logo1.jpg') }}" alt="Company Logo" class="img-fluid main-logo">
        </a>
    </div>

    <!-- ✅ Add Employee Form Section -->
    <div class="container py-5">
        <!-- Section Title -->
        <h1 class="text-center mb-4">Add New Employee</h1>

        <!-- Form for Adding a New Employee -->
        <form method="POST" class="form-container mx-auto" style="max-width: 600px;">
            <!-- Name Fields -->
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="name" class="form-label">First Name:</label>
                    <input type="text" name="name" id="name" class="form-control" placeholder="Enter first name" required>
                </div>
                <div class="col-md-6">
                    <label for="family_name" class="form-label">Family Name:</label>
                    <input type="text" name="family_name" id="family_name" class="form-control" placeholder="Enter family name" required>
                </div>
            </div>

            <!-- TFN and ABN Fields -->
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="tfn" class="form-label">TFN:</label>
                    <input type="text" name="tfn" id="tfn" class="form-control" placeholder="Enter TFN" required>
                </div>
                <div class="col-md-6">
                    <label for="abn" class="form-label">ABN:</label>
                    <input type="text" name="abn" id="abn" class="form-control" placeholder="Enter ABN" required>
                </div>
            </div>

            <!-- Address Field -->
            <div class="mb-3">
                <label for="address" class="form-label">Address:</label>
                <input type="text" name="address" id="address" class="form-control" placeholder="Enter address" required>
            </div>

            <!-- Email and Phone Fields -->
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="email" class="form-label">Email Address:</label>
                    <input type="email" name="email" id="email" class="form-control" placeholder="Enter email" required>
                </div>
                <div class="col-md-6">
                    <label for="phone" class="form-label">Phone Number:</label>
                    <input type="text" name="phone" id="phone" class="form-control" placeholder="Enter phone number" required>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="d-flex justify-content-between mb-4">
                <a href="/" class="btn btn-secondary">Back to Main Menu</a>
                <button type="submit" class="btn btn-success">Add Employee</button>
            </div>
        </form>
    </div>

    <!-- ✅ Footer Section -->
    <footer class="text-center mt-5">
        <p class="small text-muted">&copy; 2024 Gazi OGUTCU. All rights reserved.</p>
    </footer>

    <!-- ✅ JavaScript to Load Navbar -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            fetch("/navbar")
                .then(response => {
                    if (!response.ok) {
                        throw new Error("Navbar file not found!");
                    }
                    return response.text();
                })
                .then(data => {
                    document.getElementById("navbar-placeholder").innerHTML = data;
                })
                .catch(error => console.error("Error loading navbar:", error));
        });
    </script>

    <!-- ✅ Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
