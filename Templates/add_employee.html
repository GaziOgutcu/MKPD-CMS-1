<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harm Drive Pty Ltd</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom CSS -->
    <style>
        /* Navbar Styling */
        .navbar {
            background-color: #003366; /* Navy blue background */
            padding: 10px 20px;
        }

        .navbar a {
            color: white; /* Set link color */
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
        }

        .navbar a:hover, .dropdown-item:hover {
            color: yellow; /* Highlight links on hover */
        }

        .dropdown-menu {
            background-color: #003366; /* Match dropdown with navbar */
        }

        .dropdown-item {
            color: white; /* Dropdown link color */
        }

        .dropdown-item:hover {
            background-color: #00509e; /* Highlight dropdown item */
        }

        /* Logo Styling */
        .logo {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: white;
            font-family: 'Futura', sans-serif; /* Modern font */
        }

        .logo-mkpd {
            font-size: 1.2rem;
            font-weight: bold;
            line-height: 1;
        }

        .logo-cms {
            font-size: 1rem;
            line-height: 1;
        }

        /* Main Logo Styling */
        .main-logo {
            max-width: 300px; /* Increased size for the logo */
        }

        .table-responsive {
            margin-top: 30px;
        }

        .table-bordered th, .table-bordered td {
            text-align: center;
            vertical-align: middle;
        }

        .add-vehicle-form {
            margin-top: 20px;
        }

        .copyright {
            position: fixed;
            bottom: 0;
            right: 0;
            padding: 10px;
            font-size: 12px;
            color: #6c757d;
            background-color: #f8f9fa;
            border-top-left-radius: 5px;
        }
    </style>
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container-fluid">
        <a class="navbar-brand logo" href="{{ url_for('index') }}">
            <span class="logo-mkpd">MKPD</span>
            <span class="logo-cms">CMS</span>
        </a>

        <!-- Navigation Menu -->
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <!-- Companies Dropdown -->
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" id="companiesDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        Companies
                    </a>
                    <ul class="dropdown-menu" aria-labelledby="companiesDropdown">
                        <li><a class="dropdown-item" href="/view_company">View Companies</a></li>
                        <li><a class="dropdown-item" href="/add_company">Add Company</a></li>
                    </ul>
                </li>

                <!-- Harm Drive -->
                <li class="nav-item"><a class="nav-link" href="/harm_drive">Harm Drive</a></li>

                <!-- Employees Dropdown -->
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" id="employeesDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        Employees
                    </a>
                    <ul class="dropdown-menu" aria-labelledby="employeesDropdown">
                        <li><a class="dropdown-item" href="/add_employee">Add Employee</a></li>
                        <li><a class="dropdown-item" href="/search_employee">Search Employee</a></li>
                    </ul>
                </li>

                <!-- Projects Dropdown -->
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" id="projectsDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        Projects
                    </a>
                    <ul class="dropdown-menu" aria-labelledby="projectsDropdown">
                        <li><a class="dropdown-item" href="/add_project">Add a Project</a></li>
                        <li><a class="dropdown-item" href="/view_projects">View Projects</a></li>
                    </ul>
                </li>
            </ul>

            <!-- Logout -->
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/logout">Logout</a></li>
            </ul>
        </div>
    </div>
</nav>

    <!-- Logo Section -->
    <div class="text-center my-4">
        <a href="/">
            <img src="{{ url_for('static', filename='logo1.jpg') }}" alt="Company Logo" class="img-fluid mb-4 main-logo">
        </a>
    </div>

    <!-- Add Employee Section -->
    <div class="container mt-5">
        <h1 class="text-center mb-4">Add New Employee</h1>
        <form method="POST">
            <!-- Name Fields -->
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="name" class="form-label">First Name</label>
                    <input type="text" class="form-control" id="name" name="name" required>
                </div>
                <div class="col-md-6">
                    <label for="family_name" class="form-label">Family Name</label>
                    <input type="text" class="form-control" id="family_name" name="family_name" required>
                </div>
            </div>

            <!-- TFN and ABN Fields -->
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="tfn" class="form-label">TFN</label>
                    <input type="text" class="form-control" id="tfn" name="tfn" required>
                </div>
                <div class="col-md-6">
                    <label for="abn" class="form-label">ABN</label>
                    <input type="text" class="form-control" id="abn" name="abn" required>
                </div>
            </div>

            <!-- Address Field -->
            <div class="mb-3">
                <label for="address" class="form-label">Address</label>
                <input type="text" class="form-control" id="address" name="address" required>
            </div>

            <!-- Email and Phone Fields -->
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" class="form-control" id="email" name="email" required>
                </div>
                <div class="col-md-6">
                    <label for="phone" class="form-label">Phone Number</label>
                    <input type="text" class="form-control" id="phone" name="phone" required>
                </div>
            </div>

            <!-- Add Employee Button -->
            <div class="d-flex justify-content-center mb-5">
                <button type="submit" class="btn btn-success mx-2">Add Employee</button>
            </div>
        </form>

        <!-- Centered Navigation Buttons -->
        <div class="d-flex justify-content-center">
            <a href="/" class="btn btn-danger mx-2">Back to Main Menu</a>
        </div>
    </div>

    <!-- Footer -->
    <div class="copyright">
        &copy; 2024 Gazi OGUTCU. All rights reserved.
    </div>

</body>
</html>
