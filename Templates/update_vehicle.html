<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MKPD CMS / Update Vehicle</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body class="bg-light">

    <!-- ✅ Navbar Placeholder -->
    <div id="navbar-placeholder"></div>

    <!-- ✅ Logo Section -->
    <div class="text-center my-4">
        <a href="/">
            <img src="{{ url_for('static', filename='logo1.jpg') }}" alt="Company Logo" class="img-fluid mb-4 main-logo">
        </a>
    </div>

    <!-- ✅ Update Vehicle Form Section -->
    <div class="container py-5">
        <h1 class="text-center text-primary mb-4">Update Vehicle</h1>
        <form action="{{ url_for('update_vehicle') }}" method="POST" class="p-4 border rounded shadow-sm bg-white">
            <input type="hidden" name="plate_to_update" value="{{ vehicle.Plate }}">
            
            <!-- Rego Renewal Date Field -->
            <div class="mb-3">
                <label for="rego_renewal_update" class="form-label">Rego Renewal Date</label>
                <input type="date" class="form-control" id="rego_renewal_update" name="rego_renewal_update" placeholder="Enter Rego Renewal Date" required>
            </div>

            <!-- Expiry Field -->
            <div class="mb-3">
                <label for="expiry_update" class="form-label">Expiry (Days)</label>
                <input type="number" class="form-control" id="expiry_update" name="expiry_update" placeholder="Enter Expiry (Days)" required>
            </div>

            <!-- Action Buttons -->
            <div class="d-flex justify-content-between">
                <a href="/" class="btn btn-secondary">Back to Main Menu</a>
                <button type="submit" class="btn btn-success">Update Vehicle</button>
            </div>
        </form>
    </div>

    <!-- ✅ Footer -->
    <footer class="text-center mt-5">
        <p class="small text-muted">&copy; 2024 Gazi OGUTCU. All rights reserved.</p>
    </footer>

    <!-- ✅ JavaScript to Load Navbar -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            fetch("/navbar")
                .then(response => {
                    if (!response.ok) {
                        throw new Error("Navbar file not found!");
                    }
                    return response.text();
                })
                .then(data => {
                    document.getElementById("navbar-placeholder").innerHTML = data;
                })
                .catch(error => console.error("Error loading navbar:", error));
        });
    </script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
