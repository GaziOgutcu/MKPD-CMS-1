<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MKPD CMS / Add a new company</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <<link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body>
    <div class="container">

    <!-- ✅ Navbar Placeholder (Loads navbar dynamically) -->
    <div id="navbar-placeholder"></div>

    <!-- Logo -->
    <div class="text-center mb-4">
        <a href="/">
            <img src="{{ url_for('static', filename='logo1.jpg') }}" alt="Company Logo" class="img-fluid main-logo">
        </a>
    </div>

    <!-- Add Company Form -->
    <h1 class="text-center mb-4">Add a New Company</h1>
    <form method="POST" enctype="multipart/form-data" class="form-container">

            <!-- General Fields -->
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="company_name" class="form-label">Company Name:</label>
                    <input type="text" name="company_name" id="company_name" class="form-control" placeholder="Enter company name" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="registration_date" class="form-label">Registration Date:</label>
                    <input type="date" name="registration_date" id="registration_date" class="form-control">
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="abn" class="form-label">ABN:</label>
                    <input type="text" name="abn" id="abn" class="form-control" placeholder="Enter ABN (11-digit number)" required pattern="\d{11}" title="ABN must be 11 digits">
                </div>
                <div class="col-md-6 mb-3">
                    <label for="qbcc_license_number" class="form-label">QBCC License Number:</label>
                    <input type="text" name="qbcc_license_number" id="qbcc_license_number" class="form-control" placeholder="Enter QBCC License Number">
                </div>
            </div>

            <!-- Optional Fields -->
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="acn" class="form-label">ACN:</label>
                    <input type="text" name="acn" id="acn" class="form-control" placeholder="Enter ACN (optional)">
                </div>
                <div class="col-md-6 mb-3">
                    <label for="type" class="form-label">Type:</label>
                    <input type="text" name="type" id="type" class="form-control" placeholder="Enter company type (e.g., Private, Public)">
                </div>
            </div>

            <div class="mb-3">
                <label for="registered_address" class="form-label">Registered Address:</label>
                <textarea name="registered_address" id="registered_address" class="form-control" rows="3" placeholder="Enter registered address"></textarea>
            </div>

            <!-- Upload Section -->
            <div class="mb-4">
                <h4 class="text-secondary">Upload Documents</h4>
                <div class="mb-3">
                    <label for="asic_extract" class="form-label">ASIC Extract (Required):</label>
                    <input type="file" name="asic_extract" id="asic_extract" class="form-control" accept=".pdf,.docx" required>
                </div>
                <div class="mb-3">
                    <label for="logo" class="form-label">Company Logo:</label>
                    <input type="file" name="logo" id="logo" class="form-control" accept=".png,.jpg,.jpeg">
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="d-flex justify-content-between">
                <a href="/" class="btn btn-secondary">Back to Main Menu</a>
                <button type="submit" class="btn btn-success">Add Company</button>
        </form>
    </div>
</body>

    <!-- ✅ Footer -->
    
    <div class="text-center mt-5">
        <p class="small text-muted">&copy; 2024 Gazi OGUTCU. All rights reserved.</p>
    </div>

    <!-- ✅ JavaScript to Load Navbar -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            fetch("/navbar")  // ✅ Fetch from Flask route
                .then(response => {
                    if (!response.ok) {
                        throw new Error("Navbar file not found!");
                    }
                    return response.text();
                })
                .then(data => {
                    document.getElementById("navbar-placeholder").innerHTML = data;
                })
                .catch(error => console.error("Error loading navbar:", error));
        });
    </script>
    
    

    <!-- ✅ Bootstrap JS (kept at the bottom for better performance) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>

</html>
