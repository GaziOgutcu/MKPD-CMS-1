{% extends 'base.html' %}
{% block title %}Add Company · MKPD CMS{% endblock %}
{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-xl-8">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h1 class="h4 mb-0">Add New Company</h1>
                </div>
                <div class="card-body">
                    <form method="POST" enctype="multipart/form-data" class="needs-validation" novalidate>
                        <div class="row g-3">
                            <div class="col-md-8">
                                <label for="company_name" class="form-label">Company Name</label>
                                <input type="text" id="company_name" name="company_name" class="form-control" required>
                            </div>
                            <div class="col-md-4">
                                <label for="registration_date" class="form-label">Registration Date</label>
                                <input type="date" id="registration_date" name="registration_date" class="form-control">
                            </div>
                            <div class="col-md-6">
                                <label for="abn" class="form-label">ABN</label>
                                <input type="text" id="abn" name="abn" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label for="acn" class="form-label">ACN</label>
                                <input type="text" id="acn" name="acn" class="form-control">
                            </div>
                            <div class="col-md-6">
                                <label for="type" class="form-label">Company Type</label>
                                <input type="text" id="type" name="type" class="form-control">
                            </div>
                            <div class="col-md-6">
                                <label for="qbcc_license_number" class="form-label">QBCC License Number</label>
                                <input type="text" id="qbcc_license_number" name="qbcc_license_number" class="form-control">
                            </div>
                            <div class="col-12">
                                <label for="registered_address" class="form-label">Registered Address</label>
                                <input type="text" id="registered_address" name="registered_address" class="form-control">
                            </div>
                        </div>

                        <hr class="my-4">

                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="asic_extract" class="form-label">ASIC Extract (PDF, DOCX, or image)</label>
                                <input type="file" id="asic_extract" name="asic_extract" class="form-control" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png" required>
                            </div>
                            <div class="col-md-6">
                                <label for="company_registration" class="form-label">Company Registration (optional)</label>
                                <input type="file" id="company_registration" name="company_registration" class="form-control" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png">
                            </div>
                            <div class="col-md-6">
                                <label for="logo" class="form-label">Company Logo (optional)</label>
                                <input type="file" id="logo" name="logo" class="form-control" accept=".jpg,.jpeg,.png">
                            </div>
                        </div>

                        <div class="d-flex justify-content-between mt-4">
                            <a href="{{ url_for('view_company') }}" class="btn btn-outline-secondary">Cancel</a>
                            <button type="submit" class="btn btn-success">Save Company</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
