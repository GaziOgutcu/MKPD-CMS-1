<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harm Drive Pty Ltd</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom CSS -->
    <style>
        /* Navbar Styling */
        .navbar {
            background-color: #003366; /* Navy blue background */
            padding: 10px 20px;
        }

        .navbar a {
            color: white; /* Set link color */
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
        }

        .navbar a:hover, .dropdown-item:hover {
            color: yellow; /* Highlight links on hover */
        }

        .dropdown-menu {
            background-color: #003366; /* Match dropdown with navbar */
        }

        .dropdown-item {
            color: white; /* Dropdown link color */
        }

        .dropdown-item:hover {
            background-color: #00509e; /* Highlight dropdown item */
        }

        /* Logo Styling */
        .logo {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: white;
            font-family: 'Futura', sans-serif; /* Modern font */
        }

        .logo-mkpd {
            font-size: 1.2rem;
            font-weight: bold;
            line-height: 1;
        }

        .logo-cms {
            font-size: 1rem;
            line-height: 1;
        }

        /* Main Logo Styling */
        .main-logo {
            max-width: 300px; /* Increased size for the logo */
        }

        .table-responsive {
            margin-top: 30px;
        }

        .table-bordered th, .table-bordered td {
            text-align: center;
            vertical-align: middle;
        }

        .add-vehicle-form {
            margin-top: 20px;
        }

        .copyright {
            position: fixed;
            bottom: 0;
            right: 0;
            padding: 10px;
            font-size: 12px;
            color: #6c757d;
            background-color: #f8f9fa;
            border-top-left-radius: 5px;
        }
    </style>
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
        <!-- Logo -->
        <a class="navbar-brand logo" href="{{ url_for('index') }}">
            <span class="logo-mkpd">MKPD</span>
            <span class="logo-cms">CMS</span>
        </a>

        <!-- ✅ Navbar Toggler Button (MISSING in your code) -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Navbar Links -->
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" id="companiesDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        Companies
                    </a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="/view_company">View Companies</a></li>
                        <li><a class="dropdown-item" href="/add_company">Add Company</a></li>
                    </ul>
                </li>
                <li class="nav-item"><a class="nav-link" href="/harm_drive">Harm Drive</a></li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" id="employeesDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        Employees
                    </a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="/add_employee">Add Employee</a></li>
                        <li><a class="dropdown-item" href="/search_employee">Search Employee</a></li>
                    </ul>
                </li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" id="projectsDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        Projects
                    </a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="/add_project">Add a Project</a></li>
                        <li><a class="dropdown-item" href="/view_projects">View Projects</a></li>
                    </ul>
                </li>
            </ul>
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/logout">Logout</a></li>
            </ul>
        </div>
    </div>
</nav>



    <!-- Logo Section -->
    <div class="text-center my-4">
        <a href="/">
            <img src="{{ url_for('static', filename='logo1.jpg') }}" alt="Company Logo" class="img-fluid mb-4 main-logo">
        </a>
    </div>

    <div class="container py-5" style="padding-bottom: 80px;">

        <h1 class="text-center mb-4">Add a New Company</h1>
        
        <!-- Add Company Form -->
        <form method="POST" enctype="multipart/form-data" class="form-container">
            <!-- General Fields -->
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="company_name" class="form-label">Company Name:</label>
                    <input type="text" name="company_name" id="company_name" class="form-control" placeholder="Enter company name" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="registration_date" class="form-label">Registration Date:</label>
                    <input type="date" name="registration_date" id="registration_date" class="form-control">
                </div>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="abn" class="form-label">ABN:</label>
                    <input type="text" name="abn" id="abn" class="form-control" placeholder="Enter ABN (11-digit number)" required pattern="\d{11}" title="ABN must be 11 digits">
                </div>
                <div class="col-md-6 mb-3">
                    <label for="qbcc_license_number" class="form-label">QBCC License Number:</label>
                    <input type="text" name="qbcc_license_number" id="qbcc_license_number" class="form-control" placeholder="Enter QBCC License Number">
                </div>
            </div>

            <!-- Optional Fields -->
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="acn" class="form-label">ACN:</label>
                    <input type="text" name="acn" id="acn" class="form-control" placeholder="Enter ACN (optional)">
                </div>
                <div class="col-md-6 mb-3">
                    <label for="type" class="form-label">Type:</label>
                    <input type="text" name="type" id="type" class="form-control" placeholder="Enter company type (e.g., Private, Public)">
                </div>
            </div>
            <div class="mb-3">
                <label for="registered_address" class="form-label">Registered Address:</label>
                <textarea name="registered_address" id="registered_address" class="form-control" rows="3" placeholder="Enter registered address"></textarea>
            </div>

            <!-- Upload Section -->
            <div class="mb-4">
                <h4 class="text-secondary">Upload Documents</h4>
                <div class="mb-3">
                    <label for="asic_extract" class="form-label">ASIC Extract (Required):</label>
                    <input type="file" name="asic_extract" id="asic_extract" class="form-control" accept=".pdf,.docx" required>
                </div>
                <div class="mb-3">
                    <label for="logo" class="form-label">Company Logo:</label>
                    <input type="file" name="logo" id="logo" class="form-control" accept=".png,.jpg,.jpeg">
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="d-flex justify-content-between">
                <a href="/" class="btn btn-secondary">Back to Main Menu</a>
                <button type="submit" class="btn btn-success">Add Company</button>
            </div>
        </form>
    </div>

    <!-- Footer -->
    <div class="copyright">
        &copy; 2024 Gazi OGUTCU. All rights reserved.
    </div>

</body>
</html>
