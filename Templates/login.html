<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        .copyright {
            position: fixed;
            bottom: 10px;
            right: 10px;
            font-size: 12px;
            color: #6c757d;
        }
    </style>
</head>
<body class="bg-light">
    <div class="text-center my-4">
    <!-- Wrap the logo image in a link pointing to the main menu -->
    <a href="/">
        <img src="{{ url_for('static', filename='logo1.jpg') }}" alt="Company Logo" class="img-fluid mb-4" style="max-height: 200px;">
    </a>
    </div>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card shadow">
                    <div class="card-body">
                        <h3 class="text-center text-primary mb-4">Admin Login</h3>

                        
                        <form method="POST">
                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" name="password" id="password" class="form-control" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Login</button>
                        </form>
                    </div>
                </div>
                <p class="text-center mt-3 text-muted">&copy; 2024 Gazi OGUTCU. All rights reserved.</p>
            </div>
        </div>
    </div>
</body>
</html>
