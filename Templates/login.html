<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MKPD CMS - Login</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>

    <!-- Login Page Wrapper -->
    <div class="login-page d-flex align-items-center justify-content-center vh-100">

        <!-- Login Card -->
        <div class="card shadow-lg login-card">

            <!-- Logo Section -->
            <div class="card-header text-center bg-dark text-white">
                <img src="{{ url_for('static', filename='logo1.jpg') }}" alt="Company Logo" class="img-fluid login-logo">
            </div>

            <!-- Login Form Section -->
            <div class="card-body text-center">
                <h2 class="mb-4">Sign in to MKPD CMS</h2>
                <form method="POST" action="{{ url_for('login') }}">

                    <!-- Password Input -->
                    <div class="form-group mb-3">                        
                        <input type="password" name="password" class="input" placeholder="Enter your password!" required>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="button44">
                        <span>SIGN IN</span>
                        <svg width="15px" height="10px" viewBox="0 0 13 10">
                            <path d="M1,5 L11,5"></path>
                            <polyline points="8 1 12 5 8 9"></polyline>
                        </svg>
                    </button>

                </form>
            </div>

            <!-- Footer Section -->
            <div class="text-center mt-3 mb-3">
                <p class="small text-muted">&copy; 2024 Gazi OGUTCU. All rights reserved.</p>
            </div>

        </div> <!-- End of Login Card -->

    </div> <!-- End of Login Page Wrapper -->

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
