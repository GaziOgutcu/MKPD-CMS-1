{% extends "base.html" %}

{% block title %}Login - MKPD CMS{% endblock %}

{% block content %}
    <div class="containerbg">
        <!-- Logo -->
        <a href="/" class="logo-container">
            <img src="{{ url_for('static', filename='logo1.jpg') }}" alt="Company Logo" class="logo">
        </a>

        <!-- Form -->
        <div class="form-container">
            <form class="form" action="/login" method="POST">
                <div class="form-title"><span>Sign in to your</span></div>
                <div class="title-2"><span>MKPD CMS</span></div>

                <div class="input-container">
                    <input class="input-pwd" type="password" name="password" placeholder="Enter password" required>
                </div>

                <button type="submit" class="submit">
                    <span class="sign-text">Sign in</span>
                </button>

                <p class="signup-link">
                    No account? <a href="/signup" class="up">Sign up!</a>
                </p>
            </form>
        </div>
    </div>
{% endblock %}
