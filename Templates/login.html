<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body>
    <div class="text-center my-4">
        <a href="/">
            <img src="{{ url_for('static', filename='logo1.jpg') }}" alt="Company Logo" class="img-fluid mb-4" style="max-height: 200px;">
        </a>
    </div>
        <form class="form" action="/login" method="POST">
            <div class="form-title"><span>Sign in to your</span></div>
            <div class="title-2"><span>SPACE</span></div>
    
            <div class="input-container">
                <input class="input-mail" type="email" name="email" placeholder="Enter email" required>
            </div>
    
            <div class="input-container">
                <input class="input-pwd" type="password" name="password" placeholder="Enter password" required>
            </div>
    
            <button type="submit" class="submit">
                <span class="sign-text">Sign in</span>
            </button>
    
            <p class="signup-link">
                No account? <a href="/signup" class="up">Sign up!</a>
            </p>
        </form>
</body>
