{% extends 'base.html' %}
{% block title %}MKPD CMS · Login{% endblock %}
{% block navbar %}{% endblock %}
{% block body_class %}login-page{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <div class="card shadow-lg border-0 login-card">
                <div class="card-header text-center bg-dark text-white">
                    <img src="{{ url_for('static', filename='logo1.jpg') }}" alt="Company Logo" class="img-fluid login-logo">
                </div>
                <div class="card-body text-center">
                    <h2 class="mb-4">Sign in to MKPD CMS</h2>
                    <form method="POST" action="{{ url_for('login') }}">
                        <div class="mb-3">
                            <label for="password" class="form-label visually-hidden">Password</label>
                            <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required>
                        </div>
                        <button type="submit" class="button44 w-100">
                            <span>Sign In</span>
                            <svg width="15px" height="10px" viewBox="0 0 13 10" aria-hidden="true">
                                <path d="M1,5 L11,5"></path>
                                <polyline points="8 1 12 5 8 9"></polyline>
                            </svg>
                        </button>
                    </form>
                </div>
                <div class="card-footer text-center text-muted small">
                    &copy; {{ current_year }} MKPD CMS
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
